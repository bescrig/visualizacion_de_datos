<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualización PEC 2</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.3rem;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    iframe.viz-frame {
      width: 100%;
      height: 750px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- TÉCNICA 1 - FLOURISH PUBLIC -->
    <div class="card">
      <h2>Técnica 1 - Flourish</h2>
      <iframe 
        src="https://flo.uri.sh/visualisation/30737629/embed" 
        class="viz-frame" 
        title="Visualización Flourish"
        allowfullscreen>
      </iframe>
    </div>

    <!-- TÉCNICA 2 - RPUBS -->
    <div class="card">
      <h2>Técnica 2 - R</h2>
      <iframe 
        src="https://rpubs-api.s3-website-us-east-1.amazonaws.com/1472095_d37d2f0b7c254b73b5df5b10fb0364c1.html" 
        class="viz-frame" 
        title="Visualización R">
      </iframe>
    </div>

    <!-- TÉCNICA 3 - TABLEAU PUBLIC -->
    <div class="card">
      <h2>Técnica 3 - Tableau</h2>
      <iframe 
        src="https://public.tableau.com/views/ranking_contaminacion/Hoja3?:showVizHome=no&:embed=true&:language=es-ES&:display_count=n&:origin=viz_share_link" 
        class="viz-frame" 
        title="Visualización Tableau"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</body>
</html>
