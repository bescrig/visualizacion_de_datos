<!DOCTYPE html>
<html lang="es">
<head>

  <title>Visualización PEC 2</title>
  <style>
    body {

      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
